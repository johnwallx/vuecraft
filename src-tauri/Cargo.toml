[package]
name = "vuecraft"
description = "VUECraft concept-map editor (desktop shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
map-core = { path = "../crates/map-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Test-only embedded WebDriver server; compiled in only with --features e2e-webdriver.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
tauri-plugin-wdio = { version = "=1.5.1", optional = true }

[features]
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]
